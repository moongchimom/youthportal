spring.application.name=youthportal
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/xe
spring.datasource.username=scott
spring.datasource.password=kosa1004

#서버 포트 설정
server.port=8380

#서버의 코드가 수정되면 자동으로 서버가 리로드 된다
#운영서버 리로드 
spring.devtools.restart.enabled=true
#개발서버 리로드
spring.devtools.livereload.enabled=true

logging.level.org.springframework=info
logging.level.kr.or.oti=info
logging.level.org.springframework.security=info


# MyBatis 설정
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Thymeleaf 캐시 끄기 (개발 중 새로고침 즉시 반영)
spring.thymeleaf.cache=false

# 파일 업로드 설정 (신청서 첨부파일)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 첨부파일 저장 경로 (프로젝트 실행 위치 기준 상대경로)
app.upload-dir=uploads

# 요청/응답 문자 인코딩을 UTF-8로 강제 (윈도우 환경에서 한글 폼 데이터가 깨지는 것을 방지)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 온통청년 오픈 API키값 등록
youthportal.api.key=4ce22bb8-6c0a-4d1b-b4f3-c3167e403335
youthportal.api.url=https://www.youthcenter.go.kr/go/ythip/getPlcy

