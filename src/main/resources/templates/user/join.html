<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>회원가입 - 청년정책포탈</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<div th:replace="~{layout/header :: header}"></div>

	<!-- ===================== 회원가입 화면 ===================== -->
	<div class="content-wrap">
		<div class="container" style="max-width: 480px;">
			<h2 class="page-title">회원가입</h2>

			<!-- 아이디 중복, 비밀번호 불일치 등의 오류 메시지 -->
			<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

			<!-- id="joinForm"은 static/js/app.js에서 비밀번호 일치 여부를 검사할 때 사용 -->
			<form id="joinForm" th:action="@{/user/join}" method="post">
				<div class="mb-3">
					<label for="userId" class="form-label">아이디</label>
					<input type="text" id="userId" name="userId" class="form-control" required>
				</div>
				<div class="mb-3">
					<label for="upw" class="form-label">비밀번호</label>
					<input type="password" id="upw" name="upw" class="form-control" required>
				</div>
				<div class="mb-3">
					<label for="upwConfirm" class="form-label">비밀번호 확인</label>
					<input type="password" id="upwConfirm" name="upwConfirm" class="form-control" required>
				</div>
				<div class="mb-3">
					<label for="name" class="form-label">이름</label>
					<input type="text" id="name" name="name" class="form-control" required>
				</div>
				<div class="mb-3">
					<label for="birthDate" class="form-label">생년월일 (예: 20000101)</label>
					<input type="text" id="birthDate" name="birthDate" class="form-control" placeholder="yyyyMMdd" required>
				</div>
				<div class="mb-3">
					<label for="phone" class="form-label">휴대폰 번호</label>
					<input type="text" id="phone" name="phone" class="form-control" placeholder="010-0000-0000">
				</div>
				<button type="submit" class="btn btn-primary w-100">가입하기</button>
			</form>
		</div>
	</div>

	<div th:replace="~{layout/footer :: footer}"></div>
	<div th:replace="~{layout/footer :: scripts}"></div>
	<script th:src="@{/js/app.js}"></script>

</body>
</html>
