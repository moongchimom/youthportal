<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>로그인 - 청년정책포탈</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<div th:replace="~{layout/header :: header}"></div>

	<!-- ===================== 로그인 화면 ===================== -->
	<div class="content-wrap">
		<div class="container" style="max-width: 420px;">
			<h2 class="page-title">로그인</h2>

			<!-- 로그인 실패/계정 잠금 등의 오류 메시지 -->
			<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
			<!-- 회원가입 성공 직후 안내 메시지 -->
			<div class="alert alert-success" th:if="${result}" th:text="${result}"></div>

			<form th:action="@{/user/login}" method="post">
				<div class="mb-3">
					<label for="userId" class="form-label">아이디</label>
					<input type="text" id="userId" name="userId" class="form-control" required>
				</div>
				<div class="mb-3">
					<label for="upw" class="form-label">비밀번호</label>
					<input type="password" id="upw" name="upw" class="form-control" required>
				</div>
				<button type="submit" class="btn btn-primary w-100">로그인</button>
			</form>

			<div class="text-center mt-3">
				<a th:href="@{/oauth2/authorization/kakao}" class="btn btn-warning w-100">카카오로 로그인</a>
			</div>

			<div class="text-center mt-3">
				<a th:href="@{/user/join}">회원가입 하러가기</a>
			</div>
		</div>
	</div>

	<div th:replace="~{layout/footer :: footer}"></div>
	<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
