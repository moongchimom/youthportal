<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>신청 상세 - 청년정책포탈</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<div th:replace="~{layout/header :: header}"></div>

	<!-- ===================== 신청 상세 화면 ===================== -->
	<div class="content-wrap">
		<div class="container" style="max-width: 640px;">
			<h2 class="page-title">신청 상세</h2>

			<div class="alert alert-success" th:if="${result}" th:text="${result}"></div>

			<!-- 비로그인/소유자 아님/존재하지 않는 신청 등의 오류 안내 -->
			<div class="alert alert-warning" th:if="${error}" th:text="${error}"></div>

			<!-- 정상 조회된 경우에만 상세 표시 -->
			<th:block th:if="${dto != null}">
				<table class="table table-bordered">
					<tbody>
						<tr>
							<th style="width: 160px;">정책명</th>
							<td th:text="${dto.policyTitle}">정책명</td>
						</tr>
						<tr>
							<th>신청자</th>
							<td th:text="${dto.userName}">신청자</td>
						</tr>
						<tr>
							<th>신청 사유</th>
							<td style="white-space: pre-line;" th:text="${dto.reason}">신청 사유</td>
						</tr>
						<tr>
							<th>첨부파일</th>
							<td>
								<!-- 첨부파일이 여러 개일 수 있어 fileList를 순회하며 각각 다운로드 링크로 표시 -->
								<ul class="list-unstyled mb-0" th:if="${not #lists.isEmpty(fileList)}">
									<li th:each="f : ${fileList}">
										<a th:href="@{/application/download(fileNo=${f.fileNo})}" th:text="${f.originalName}">파일명</a>
									</li>
								</ul>
								<span th:if="${#lists.isEmpty(fileList)}" class="text-muted">첨부파일 없음</span>
							</td>
						</tr>
						<tr>
							<th>신청일</th>
							<td th:text="${#temporals.format(dto.applyDate, 'yyyy-MM-dd HH:mm')}">신청일</td>
						</tr>
						<tr>
							<th>처리상태</th>
							<td>
								<span class="badge" th:classappend="'badge-status-' + ${dto.status}" th:text="${dto.status}">상태</span>
							</td>
						</tr>
					</tbody>
				</table>

				<div class="d-flex justify-content-between mt-4">
					<a th:href="@{/application/list}" class="btn btn-outline-secondary">목록으로</a>

					<!-- 이미 취소된 신청이 아닐 때만 취소 버튼 노출 -->
					<form th:if="${dto.status != '취소'}" th:action="@{/application/cancel}" method="post" onsubmit="return confirm('신청을 취소하시겠습니까?');">
						<input type="hidden" name="appNo" th:value="${dto.appNo}">
						<button type="submit" class="btn btn-outline-danger">신청 취소</button>
					</form>
				</div>
			</th:block>

		</div>
	</div>

	<div th:replace="~{layout/footer :: footer}"></div>
	<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
