<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>정책 신청 - 청년정책포탈</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<div th:replace="~{layout/header :: header}"></div>

	<!-- ===================== 정책 신청서 작성 화면 ===================== -->
	<div class="content-wrap">
		<div class="container" style="max-width: 600px;">
			<h2 class="page-title">정책 신청</h2>

			<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

			<!-- 신청 대상 정책 요약 -->
			<div class="search-box">
				<span class="badge bg-primary mb-2" th:text="${policy.category}">분류</span>
				<h5 th:text="${policy.title}">정책 제목</h5>
				<p class="text-muted mb-0" th:text="${policy.targetAge}">대상 연령</p>
			</div>

			<!-- enctype="multipart/form-data" : 첨부파일 업로드를 위해 반드시 필요 -->
			<form th:action="@{/application/apply}" method="post" enctype="multipart/form-data">
				<input type="hidden" name="pno" th:value="${policy.pno}">
				<div class="mb-3">
					<label for="reason" class="form-label">신청 사유</label>
					<textarea id="reason" name="reason" class="form-control" rows="5" required></textarea>
				</div>
				<div class="mb-3">
					<label for="files" class="form-label">첨부파일 (선택, 여러 개 선택 가능)</label>
					<input type="file" id="files" name="files" class="form-control" multiple>
				</div>
				<div class="d-flex justify-content-between">
					<a th:href="@{/policy/read(pno=${policy.pno})}" class="btn btn-outline-secondary">취소</a>
					<button type="submit" class="btn btn-primary">신청하기</button>
				</div>
			</form>
		</div>
	</div>

	<div th:replace="~{layout/footer :: footer}"></div>
	<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
