<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>정책정보 - 청년정책포탈</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<div th:replace="~{layout/header :: header}"></div>

	<!-- ===================== 정책 목록 화면 ===================== -->
	<div class="content-wrap">
		<div class="container">
			<h2 class="page-title">청년정책 정보</h2>

			<!-- 관리자 등록/삭제 성공 메시지 -->
			<div class="alert alert-success" th:if="${result}" th:text="${result}"></div>
			<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

			<!-- ===== 검색 폼 : 검색대상(제목/내용), 검색어, 마감정책 포함여부, 시작일 범위 ===== -->
			<div class="search-box">
				<form th:action="@{/policy/list}" method="get" class="row g-2 align-items-center">
					<div class="col-auto">
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="checkbox" name="types" value="title" id="typeTitle"
								   th:checked="${pageRequestDTO.isCheckType('title')}">
							<label class="form-check-label" for="typeTitle">제목</label>
						</div>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="checkbox" name="types" value="content" id="typeContent"
								   th:checked="${pageRequestDTO.isCheckType('content')}">
							<label class="form-check-label" for="typeContent">내용</label>
						</div>
					</div>
					<div class="col-auto">
						<input type="text" name="keyword" class="form-control" placeholder="검색어를 입력하세요" th:value="${pageRequestDTO.keyword}">
					</div>
					<div class="col-auto">
						<input type="date" name="from" class="form-control" th:value="${pageRequestDTO.from}">
					</div>
					<div class="col-auto">~</div>
					<div class="col-auto">
						<input type="date" name="to" class="form-control" th:value="${pageRequestDTO.to}">
					</div>
					<div class="col-auto">
						<div class="form-check">
							<input class="form-check-input" type="checkbox" name="finished" value="true" id="finished" th:checked="${pageRequestDTO.finished}">
							<label class="form-check-label" for="finished">마감된 정책도 보기</label>
						</div>
					</div>
					<!-- 지역구는 현재 저장된 정책 기준 실제 값으로 드롭다운 구성 -->
					<div class="col-auto">
						<select name="region" class="form-select">
							<option value="" th:selected="${pageRequestDTO.region == null or pageRequestDTO.region == ''}">지역 전체</option>
							<option th:each="r : ${regionList}" th:value="${r}" th:text="${r}"
									th:selected="${pageRequestDTO.region == r}">지역구</option>
						</select>
					</div>
					<div class="col-auto">
						<button type="submit" class="btn btn-primary">검색</button>
					</div>
				</form>
			</div>

			<!-- ===== 정책 카드 목록 ===== -->
			<div class="row g-3" th:if="${not #lists.isEmpty(responseDTO.dtoList)}">
				<div class="col-md-4" th:each="policy : ${responseDTO.dtoList}">
					<div class="card h-100 policy-card">
						<div class="card-body">
							<span class="badge bg-primary mb-2" th:text="${policy.category}">분류</span>
							<span class="badge bg-secondary mb-2" th:if="${policy.region != null}" th:text="${policy.region}">지역구</span>
							<!-- 신청마감일이 지났으면 마감 뱃지 표시 ("마감된 정책도 보기" 체크했을 때만 보이는 정책들에 해당) -->
							<span class="badge bg-danger mb-2" th:if="${policy.finished}">마감</span>
							<h5 class="card-title" th:text="${policy.title}">정책 제목</h5>
							<p class="card-text text-muted" th:text="${policy.targetAge}">대상 연령</p>
							<p class="card-text">
								<!-- 시작일/종료일이 둘 다 없으면 상시/연중 진행 정책 (온통청년 API가 그렇게 줌) -->
								<small class="text-muted text-nowrap" th:if="${policy.startDate == null and policy.endDate == null}">상시</small>
								<small class="text-muted text-nowrap" th:if="${policy.startDate != null or policy.endDate != null}" th:text="${policy.startDate} + ' ~ ' + ${policy.endDate}">기간</small>
							</p>
							<a th:href="|/policy/read?pno=${policy.pno}&${pageRequestDTO.link}|" class="btn btn-outline-primary btn-sm">자세히 보기</a>
						</div>
					</div>
				</div>
			</div>

			<!-- 검색 결과가 없을 때 -->
			<div class="alert alert-secondary" th:if="${#lists.isEmpty(responseDTO.dtoList)}">
				등록된 정책이 없습니다.
			</div>

			<!-- ===== 페이지네이션 ===== -->
			<div class="mt-4" th:replace="~{layout/pagination :: pagination(${responseDTO}, ${pageRequestDTO}, '/policy/list')}"></div>

		</div>
	</div>

	<div th:replace="~{layout/footer :: footer}"></div>
	<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
