<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>청년정책포탈</title>
	<!-- Bootstrap 5 CSS (jsdelivr CDN) -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<!-- 공통 헤더 -->
	<div th:replace="~{layout/header :: header}"></div>

	<!-- ===================== 메인(홈) 화면 ===================== -->
	<div class="content-wrap">
		<div class="container">

			<!-- 히어로(대표) 영역 -->
			<div class="p-5 mb-4 bg-primary text-white rounded-3 text-center">
				<h1 class="mb-3">청년정책포탈</h1>
				<p class="mb-4">청년을 위한 다양한 지원정책을 한 곳에서 확인하고 신청하세요.</p>
				<a th:href="@{/policy/list}" class="btn btn-light btn-lg">정책 둘러보기</a>
			</div>

			<!-- 바로가기 카드 영역 -->
			<div class="row g-4">
				<div class="col-md-4">
					<div class="card h-100 policy-card">
						<div class="card-body text-center">
							<h5 class="card-title">정책정보</h5>
							<p class="card-text">분야별 청년정책을 검색하고 상세 내용을 확인할 수 있습니다.</p>
							<a th:href="@{/policy/list}" class="btn btn-outline-primary">바로가기</a>
						</div>
					</div>
				</div>
				<div class="col-md-4">
					<div class="card h-100 policy-card">
						<div class="card-body text-center">
							<h5 class="card-title">신청내역</h5>
							<p class="card-text">내가 신청한 정책의 진행 상태를 확인할 수 있습니다.</p>
							<a th:href="@{/application/list}" class="btn btn-outline-primary">바로가기</a>
						</div>
					</div>
				</div>
				<div class="col-md-4">
					<div class="card h-100 policy-card">
						<div class="card-body text-center">
							<h5 class="card-title">회원가입</h5>
							<p class="card-text">아직 회원이 아니라면 가입 후 정책을 신청해보세요.</p>
							<a th:href="@{/user/join}" class="btn btn-outline-primary">바로가기</a>
						</div>
					</div>
				</div>
			</div>

		</div>
	</div>

	<!-- 공통 푸터 -->
	<div th:replace="~{layout/footer :: footer}"></div>
	<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
