<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>회원 상세 - 청년정책포탈</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<div th:replace="~{layout/header :: header}"></div>

	<!-- ===================== 관리자 - 회원 상세/수정 화면 ===================== -->
	<div class="content-wrap">
		<div class="container" style="max-width: 560px;">
			<h2 class="page-title">회원 상세</h2>

			<div class="alert alert-success" th:if="${result}" th:text="${result}"></div>

			<table class="table table-bordered">
				<tbody>
					<tr>
						<th style="width: 140px;">아이디</th>
						<td th:text="${member.userId}">아이디</td>
					</tr>
					<tr>
						<th>이름</th>
						<td th:text="${member.name}">이름</td>
					</tr>
					<tr>
						<th>생년월일</th>
						<td th:text="${member.birthDate}">생년월일</td>
					</tr>
					<tr>
						<th>휴대폰</th>
						<td th:text="${member.phone}">휴대폰</td>
					</tr>
					<tr>
						<th>가입일</th>
						<td th:text="${#temporals.format(member.regDate, 'yyyy-MM-dd HH:mm')}">가입일</td>
					</tr>
					<tr>
						<th>로그인 실패 횟수</th>
						<td th:text="${member.failCount}">0</td>
					</tr>
				</tbody>
			</table>

			<!-- 회원 상태 수정 폼 -->
			<form th:action="@{/admin/member/modify}" method="post">
				<input type="hidden" name="userId" th:value="${member.userId}">

				<div class="form-check mb-2">
					<input class="form-check-input" type="checkbox" name="del" value="true" id="del" th:checked="${member.del}">
					<label class="form-check-label" for="del">탈퇴 처리</label>
				</div>
				<div class="form-check mb-2">
					<input class="form-check-input" type="checkbox" name="accountLocked" value="true" id="accountLocked" th:checked="${member.accountLocked}">
					<label class="form-check-label" for="accountLocked">계정 잠금</label>
				</div>
				<div class="form-check mb-3">
					<input class="form-check-input" type="checkbox" name="resetFailCount" value="true" id="resetFailCount">
					<label class="form-check-label" for="resetFailCount">로그인 실패 횟수 초기화</label>
				</div>

				<div class="d-flex justify-content-between">
					<a th:href="@{/admin/member/list}" class="btn btn-outline-secondary">목록으로</a>
					<button type="submit" class="btn btn-primary">저장</button>
				</div>
			</form>
		</div>
	</div>

	<div th:replace="~{layout/footer :: footer}"></div>
	<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
