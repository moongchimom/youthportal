<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>회원관리 - 청년정책포탈</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<div th:replace="~{layout/header :: header}"></div>

	<!-- ===================== 관리자 - 회원 목록 화면 ===================== -->
	<div class="content-wrap">
		<div class="container">
			<h2 class="page-title">회원관리</h2>

			<div class="alert alert-success" th:if="${result}" th:text="${result}"></div>

			<!-- 아이디/이름 검색 -->
			<div class="search-box">
				<form th:action="@{/admin/member/list}" method="get" class="row g-2">
					<div class="col-auto">
						<input type="text" name="keyword" class="form-control" placeholder="아이디 또는 이름 검색" th:value="${pageRequestDTO.keyword}">
					</div>
					<div class="col-auto">
						<button type="submit" class="btn btn-primary">검색</button>
					</div>
				</form>
			</div>

			<table class="table table-hover">
				<thead class="table-light">
					<tr>
						<th>아이디</th>
						<th>이름</th>
						<th>가입일</th>
						<th>권한</th>
						<th>상태</th>
						<th>상세</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="member : ${responseDTO.dtoList}">
						<td th:text="${member.userId}">아이디</td>
						<td th:text="${member.name}">이름</td>
						<td th:text="${#temporals.format(member.regDate, 'yyyy-MM-dd HH:mm')}">가입일</td>
						<td th:text="${member.role} ? '관리자' : '일반회원'">권한</td>
						<td>
							<span th:if="${member.del}" class="badge bg-secondary">탈퇴</span>
							<span th:if="${member.accountLocked}" class="badge bg-danger">잠김</span>
							<span th:if="${!member.del and !member.accountLocked}" class="badge bg-success">정상</span>
						</td>
						<td>
							<a th:href="@{/admin/member/read(userId=${member.userId})}" class="btn btn-sm btn-outline-primary">상세보기</a>
						</td>
					</tr>
				</tbody>
			</table>

			<div class="alert alert-secondary" th:if="${#lists.isEmpty(responseDTO.dtoList)}">
				조회된 회원이 없습니다.
			</div>

			<div class="mt-4" th:replace="~{layout/pagination :: pagination(${responseDTO}, ${pageRequestDTO}, '/admin/member/list')}"></div>

		</div>
	</div>

	<div th:replace="~{layout/footer :: footer}"></div>
	<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
