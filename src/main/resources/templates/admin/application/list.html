<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>신청관리 - 청년정책포탈</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<div th:replace="~{layout/header :: header}"></div>

	<!-- ===================== 관리자 - 전체 신청 목록 화면 ===================== -->
	<div class="content-wrap">
		<div class="container">
			<div class="d-flex justify-content-between align-items-center">
				<h2 class="page-title">신청관리</h2>
				<!-- 온통청년 API에서 정책 목록을 가져와 저장(신규 등록/기존 갱신) -->
				<form th:action="@{/admin/policy/import}" method="post" onsubmit="return confirm('온통청년 API에서 정책 목록을 가져오시겠습니까?');">
					<button type="submit" class="btn btn-outline-primary">정책 가져오기</button>
				</form>
			</div>

			<div class="alert alert-success" th:if="${result}" th:text="${result}"></div>

			<!-- 회원아이디/이름/정책명 검색 + 신청일 범위 검색 -->
			<div class="search-box">
				<form th:action="@{/admin/application/list}" method="get" class="row g-2 align-items-center">
					<div class="col-auto">
						<input type="text" name="keyword" class="form-control" placeholder="아이디/이름/정책명 검색" th:value="${pageRequestDTO.keyword}">
					</div>
					<div class="col-auto">
						<input type="date" name="from" class="form-control" th:value="${pageRequestDTO.from}">
					</div>
					<div class="col-auto">~</div>
					<div class="col-auto">
						<input type="date" name="to" class="form-control" th:value="${pageRequestDTO.to}">
					</div>
					<div class="col-auto">
						<button type="submit" class="btn btn-primary">검색</button>
					</div>
				</form>
			</div>

			<table class="table table-hover">
				<thead class="table-light">
					<tr>
						<th>신청자</th>
						<th>정책명</th>
						<th>신청일</th>
						<th>현재상태</th>
						<th>상태변경</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="app : ${responseDTO.dtoList}">
						<td th:text="${app.userName} + ' (' + ${app.userId} + ')'">신청자</td>
						<td th:text="${app.policyTitle}">정책명</td>
						<td th:text="${#temporals.format(app.applyDate, 'yyyy-MM-dd HH:mm')}">신청일</td>
						<td>
							<span class="badge" th:classappend="'badge-status-' + ${app.status}" th:text="${app.status}">상태</span>
						</td>
						<td>
							<!-- 행마다 상태변경 폼을 두어 바로 승인/반려 처리 -->
							<form th:action="@{/admin/application/status}" method="post" class="d-flex gap-1">
								<input type="hidden" name="appNo" th:value="${app.appNo}">
								<select name="status" class="form-select form-select-sm" style="width:auto;">
									<option value="접수중" th:selected="${app.status == '접수중'}">접수중</option>
									<option value="승인" th:selected="${app.status == '승인'}">승인</option>
									<option value="반려" th:selected="${app.status == '반려'}">반려</option>
								</select>
								<button type="submit" class="btn btn-sm btn-outline-primary">변경</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>

			<div class="alert alert-secondary" th:if="${#lists.isEmpty(responseDTO.dtoList)}">
				조회된 신청 내역이 없습니다.
			</div>

			<div class="mt-4" th:replace="~{layout/pagination :: pagination(${responseDTO}, ${pageRequestDTO}, '/admin/application/list')}"></div>

		</div>
	</div>

	<div th:replace="~{layout/footer :: footer}"></div>
	<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
